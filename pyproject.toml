[build-system]
requires = ["hatchling>=1.27,<2", "packaging>=24"]
build-backend = "hatchling.build"

[project]
name = "cuemol"
dynamic = ["version"]
description = "CueMol molecular visualization desktop application and command line"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "tritium/packaging/python/README.md"

[project.urls]
Homepage = "https://www.cuemol.org/"
Source = "https://github.com/CueMol/cuemol2"

[project.scripts]
cuemol = "cuemol_launcher:main"

[tool.hatch.version]
path = "src/_version.h"
pattern = 'QM_VERSION "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["tritium/packaging/python/cuemol_launcher"]

[tool.hatch.build.hooks.custom]
path = "tritium/packaging/python/hatch_build.py"
